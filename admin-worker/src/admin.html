<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vi-Lain CMS</title>
<style>
:root{
  color-scheme:dark;
  --bg:#07070a;
  --panel:#101015;
  --line:#ffffff18;
  --text:#f7f3f6;
  --muted:#9c949c;
  --red:#d72a4e;
  --pink:#ff3e9d;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(circle at 20% 0,#2c101a 0,transparent 32%),
    radial-gradient(circle at 80% 0,#291021 0,transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:Inter,"Noto Sans JP",system-ui,sans-serif;
}
button,input,textarea,select{font:inherit}
.shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
aside{
  border-right:1px solid var(--line);
  background:#08080bd9;
  padding:28px 18px;
  position:sticky;top:0;height:100vh
}
.brand{font-size:28px;font-weight:900;letter-spacing:-.05em;margin:0 10px 6px}
.sub{color:var(--muted);font-size:11px;letter-spacing:.18em;margin:0 10px 28px}
nav{display:grid;gap:8px}
nav button{
  border:1px solid transparent;background:transparent;color:#c7c0c6;
  padding:13px 14px;text-align:left;border-radius:10px;cursor:pointer
}
nav button.active,nav button:hover{
  color:#fff;border-color:var(--line);
  background:linear-gradient(90deg,#d72a4e16,#ff3e9d0b)
}
main{padding:34px;min-width:0}
.topbar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}
h1{font-size:clamp(34px,5vw,64px);margin:0;letter-spacing:-.05em}
.user{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:#ffffff08;color:#fff;
  padding:11px 15px;border-radius:999px;cursor:pointer
}
.btn.primary{background:linear-gradient(90deg,var(--red),var(--pink));border:0}
.btn.danger{border-color:#ff315f55;color:#ff9ab4}
.grid{display:grid;gap:14px}
.card{
  border:1px solid var(--line);background:#0d0d12d9;
  padding:18px;border-radius:14px
}
.card-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.card h3{margin:0 0 8px;font-size:18px}
.meta{color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{padding:8px 11px;font-size:12px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
dialog{
  width:min(720px,94vw);border:1px solid var(--line);border-radius:16px;
  background:#0d0d12;color:#fff;padding:0;box-shadow:0 30px 100px #000b
}
dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
.modal{padding:24px}
.modal h2{margin:0 0 20px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:7px}
.field.full{grid-column:1/-1}
label{font-size:12px;color:#c7c0c6}
input,textarea,select{
  width:100%;border:1px solid var(--line);border-radius:10px;
  background:#07070b;color:#fff;padding:12px
}
textarea{min-height:110px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.notice{
  position:fixed;right:20px;bottom:20px;max-width:420px;
  background:#111118;border:1px solid var(--line);padding:13px 16px;
  border-radius:12px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s
}
.notice.show{opacity:1;transform:none}
.badge{display:inline-block;padding:5px 8px;border:1px solid var(--line);border-radius:999px;font-size:10px}
.badge.off{color:#aaa}
.badge.on{color:#ff9ab4;border-color:#ff315f55}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  nav{grid-template-columns:repeat(4,1fr)}
  nav button{text-align:center;padding:10px 4px;font-size:12px}
  main{padding:22px}
}
@media(max-width:620px){
  .form{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .card-head{flex-direction:column}
}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">Vi-Lain</div>
    <div class="sub">CONTENT MANAGEMENT</div>
    <nav id="nav"></nav>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h1 id="page-title">NEWS</h1>
        <div class="user" id="user">認証確認中...</div>
      </div>
      <div class="toolbar">
        <button class="btn" id="reload">再読み込み</button>
        <button class="btn primary" id="add">＋ 新規追加</button>
      </div>
    </div>
    <section id="list" class="grid"></section>
  </main>
</div>

<dialog id="editor">
  <form method="dialog" class="modal" id="form">
    <h2 id="dialog-title">新規追加</h2>
    <div class="form" id="fields"></div>
    <div class="modal-actions">
      <button class="btn" value="cancel">キャンセル</button>
      <button class="btn primary" id="save" value="default">保存</button>
    </div>
  </form>
</dialog>

<div class="notice" id="notice"></div>

<script>
const TYPES = {
  news: {
    title: "NEWS",
    fields: [
      ["title","タイトル","text",true],
      ["date","日付","date",false],
      ["category","カテゴリ","select",true,["INFO","MUSIC","GOODS","EVENT","LIVE"]],
      ["url","リンクURL","url",false],
      ["published","公開","checkbox",false],
      ["publishAt","公開予約","datetime-local",false],
    ]
  },
  music: {
    title: "MUSIC",
    fields: [
      ["title","曲名","text",true],
      ["artist","歌唱者","select",true,["ALROD","CHROM","VI-LAIN"]],
      ["url","YouTube URL","url",true],
      ["date","公開日","date",false],
      ["published","公開","checkbox",false],
      ["publishAt","公開予約","datetime-local",false],
    ]
  },
  goods: {
    title: "GOODS",
    fields: [
      ["title","商品名","text",true],
      ["status","販売状況","select",true,["COMING SOON","ON SALE","SOLD OUT","販売終了"]],
      ["image","画像パス","text",true],
      ["url","販売ページURL","url",true],
      ["price","価格","text",false],
      ["description","説明","textarea",false],
      ["published","公開","checkbox",false],
      ["publishAt","公開予約","datetime-local",false],
    ]
  },
  events: {
    title: "EVENT",
    fields: [
      ["title","イベント名","text",true],
      ["date","開催日時","text",true],
      ["url","詳細URL","url",false],
      ["image","画像パス","text",false],
      ["description","説明","textarea",false],
      ["published","公開","checkbox",false],
      ["publishAt","公開予約","datetime-local",false],
    ]
  }
};

let state={type:"news",data:null,user:null};

const $=s=>document.querySelector(s);
const notice=message=>{
  const el=$("#notice");el.textContent=message;el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2600);
};
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

async function api(path,options={}){
  const response=await fetch(path,{
    headers:{"Content-Type":"application/json",...(options.headers||{})},
    ...options
  });
  if(!response.ok){
    let message="通信に失敗しました";
    try{message=(await response.json()).error||message}catch{}
    throw new Error(message);
  }
  return response.status===204?null:response.json();
}

function makeNav(){
  const nav=$("#nav");nav.innerHTML="";
  Object.entries(TYPES).forEach(([key,item])=>{
    const button=document.createElement("button");
    button.textContent=item.title;
    button.classList.toggle("active",state.type===key);
    button.onclick=()=>{state.type=key;makeNav();render();};
    nav.appendChild(button);
  });
}

function render(){
  $("#page-title").textContent=TYPES[state.type].title;
  const items=state.data?.[state.type]||[];
  const list=$("#list");
  if(!items.length){
    list.innerHTML='<div class="empty">まだ登録されていません。</div>';
    return;
  }
  list.innerHTML=items.map(item=>`
    <article class="card">
      <div class="card-head">
        <div>
          <h3>${esc(item.title)}</h3>
          <div class="meta">
            <span>${esc(item.date||item.artist||item.status||"")}</span>
            <span class="badge ${item.published!==false?"on":"off"}">${item.published!==false?"公開":"非表示"}</span>
            <span>ID: ${esc(item.id)}</span>
          </div>
        </div>
        <div class="actions">
          <button class="btn" onclick="editItem('${esc(item.id)}')">編集</button>
          <button class="btn" onclick="toggleItem('${esc(item.id)}',${item.published!==false})">${item.published!==false?"非表示":"公開"}</button>
          <button class="btn danger" onclick="deleteItem('${esc(item.id)}')">削除</button>
        </div>
      </div>
    </article>
  `).join("");
}

function fieldHtml(def,item={}){
  const [key,label,type,required,options]=def;
  const value=item[key]??(type==="checkbox"?true:"");
  if(type==="textarea"){
    return `<div class="field full"><label>${label}</label><textarea name="${key}" ${required?"required":""}>${esc(value)}</textarea></div>`;
  }
  if(type==="select"){
    return `<div class="field"><label>${label}</label><select name="${key}">${options.map(x=>`<option ${x===value?"selected":""}>${esc(x)}</option>`).join("")}</select></div>`;
  }
  if(type==="checkbox"){
    return `<div class="field"><label><input style="width:auto" type="checkbox" name="${key}" ${value?"checked":""}> ${label}</label></div>`;
  }
  let display=value;
  if(type==="datetime-local"&&value)display=String(value).replace("+09:00","").slice(0,16);
  return `<div class="field"><label>${label}</label><input type="${type}" name="${key}" value="${esc(display)}" ${required?"required":""}></div>`;
}

function openEditor(item=null){
  $("#dialog-title").textContent=item?"編集":"新規追加";
  $("#fields").innerHTML=TYPES[state.type].fields.map(f=>fieldHtml(f,item||{})).join("");
  $("#form").dataset.id=item?.id||"";
  $("#editor").showModal();
}

window.editItem=id=>{
  const item=state.data[state.type].find(x=>x.id===id);
  openEditor(item);
};

window.toggleItem=async(id,current)=>{
  await api(`/api/items/${state.type}/${encodeURIComponent(id)}`,{
    method:"PATCH",
    body:JSON.stringify({published:!current})
  });
  await load();
  notice(current?"非表示にしました":"公開しました");
};

window.deleteItem=async id=>{
  if(!confirm("本当に削除しますか？"))return;
  await api(`/api/items/${state.type}/${encodeURIComponent(id)}`,{method:"DELETE"});
  await load();
  notice("削除しました");
};

async function load(){
  const [data,me]=await Promise.all([api("/api/content"),api("/api/me")]);
  state.data=data;state.user=me;
  $("#user").textContent=`${me.email} でログイン中`;
  render();
}

$("#form").addEventListener("submit",async event=>{
  event.preventDefault();
  const fd=new FormData(event.currentTarget);
  const payload={};
  TYPES[state.type].fields.forEach(([key,,type])=>{
    payload[key]=type==="checkbox" ? fd.has(key) : String(fd.get(key)||"").trim();
  });
  const id=event.currentTarget.dataset.id;
  if(id){
    await api(`/api/items/${state.type}/${encodeURIComponent(id)}`,{
      method:"PATCH",body:JSON.stringify(payload)
    });
  }else{
    await api(`/api/items/${state.type}`,{
      method:"POST",body:JSON.stringify(payload)
    });
  }
  $("#editor").close();
  await load();
  notice("保存しました");
});

$("#add").onclick=()=>openEditor();
$("#reload").onclick=()=>load().then(()=>notice("再読み込みしました"));
makeNav();
load().catch(error=>{
  $("#list").innerHTML=`<div class="empty">${esc(error.message)}</div>`;
});
</script>
</body>
</html>
