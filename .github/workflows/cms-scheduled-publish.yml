name: "CMS 06 - 公開予約を反映"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild public content
        run: python scripts/cms.py build
      - name: Commit scheduled content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content.js
          if git diff --cached --quiet; then
            echo "No scheduled changes."
            exit 0
          fi
          git commit -m "CMS: publish scheduled content"
          git push
