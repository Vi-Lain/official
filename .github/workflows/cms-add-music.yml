name: "CMS 02 - MUSICを追加"

on:
  workflow_dispatch:
    inputs:
      title:
        description: "曲名"
        required: true
        type: string
      artist:
        description: "歌唱者"
        required: true
        default: "CHROM"
        type: choice
        options: [ALROD, CHROM, VI-LAIN]
      youtube_url:
        description: "YouTube動画URL"
        required: true
        type: string
      date:
        description: "公開日（YYYY-MM-DD・空欄で今日）"
        required: false
        type: string
      published:
        description: "すぐ公開する"
        required: true
        default: true
        type: boolean
      publish_at:
        description: "公開予約（例 2026-09-06T20:00:00+09:00）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add MUSIC
        env:
          TITLE: ${{ inputs.title }}
          ARTIST: ${{ inputs.artist }}
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          DATE: ${{ inputs.date }}
          PUBLISHED: ${{ inputs.published }}
          PUBLISH_AT: ${{ inputs.publish_at }}
        run: |
          python scripts/cms.py add-music \
            --title "$TITLE" \
            --artist "$ARTIST" \
            --youtube-url "$YOUTUBE_URL" \
            --date "$DATE" \
            --published "$PUBLISHED" \
            --publish-at "$PUBLISH_AT"
      - name: Commit CMS changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cms/content.json cms/INDEX.md data/content.js .github/workflows/cms-edit.yml .github/workflows/cms-delete.yml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "CMS: ${{ github.workflow }}"
          git push
