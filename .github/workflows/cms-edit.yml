name: "CMS 05 - 内容を編集"

on:
  workflow_dispatch:
    inputs:
      collection:
        description: "編集する種類"
        required: true
        type: choice
        options: [news, music, goods, events]
      current_title:
        description: "現在のタイトル（完全一致）"
        required: true
        type: string
      title:
        description: "新しいタイトル（変更しない場合は空欄）"
        required: false
        type: string
      date:
        description: "新しい日付・日時（変更しない場合は空欄）"
        required: false
        type: string
      category:
        description: "NEWSカテゴリ（変更しない場合は空欄）"
        required: false
        type: string
      artist:
        description: "歌唱者 ALROD / CHROM / VI-LAIN（変更しない場合は空欄）"
        required: false
        type: string
      url:
        description: "新しいURL（変更しない場合は空欄）"
        required: false
        type: string
      image:
        description: "新しい画像パス（変更しない場合は空欄）"
        required: false
        type: string
      status:
        description: "GOODS販売状況（変更しない場合は空欄）"
        required: false
        type: string
      price:
        description: "価格（変更しない場合は空欄）"
        required: false
        type: string
      description:
        description: "説明（変更しない場合は空欄）"
        required: false
        type: string
      published:
        description: "公開状態"
        required: true
        default: "keep"
        type: choice
        options: [keep, "true", "false"]
      publish_at:
        description: "公開予約（変更しない場合は空欄）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Edit content
        env:
          COLLECTION: ${{ inputs.collection }}
          CURRENT_TITLE: ${{ inputs.current_title }}
          TITLE: ${{ inputs.title }}
          DATE_VALUE: ${{ inputs.date }}
          CATEGORY: ${{ inputs.category }}
          ARTIST: ${{ inputs.artist }}
          URL_VALUE: ${{ inputs.url }}
          IMAGE: ${{ inputs.image }}
          STATUS_VALUE: ${{ inputs.status }}
          PRICE: ${{ inputs.price }}
          DESCRIPTION: ${{ inputs.description }}
          PUBLISHED: ${{ inputs.published }}
          PUBLISH_AT: ${{ inputs.publish_at }}
        run: |
          python scripts/cms.py edit \
            --collection "$COLLECTION" \
            --current-title "$CURRENT_TITLE" \
            --title "$TITLE" \
            --date "$DATE_VALUE" \
            --category "$CATEGORY" \
            --artist "$ARTIST" \
            --url "$URL_VALUE" \
            --image "$IMAGE" \
            --status "$STATUS_VALUE" \
            --price "$PRICE" \
            --description "$DESCRIPTION" \
            --published "$PUBLISHED" \
            --publish-at "$PUBLISH_AT"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cms/content.json cms/INDEX.md data/content.js
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "CMS: edit content"
          git push
