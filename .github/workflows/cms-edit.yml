name: "CMS 05 - 内容を選んで編集"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "編集する項目をタイトルから選択"
        required: true
        type: choice
        options:
          - "NEWS｜Vi-Lain Official Website 制作開始｜公開｜news-site-start"
          - "NEWS｜アルロッド3周年ちびキャラグッズ 販売中｜公開｜news-alrod-3rd-goods"
          - "MUSIC｜フィクサー｜公開｜music-4EkQT4mcDRE"
          - "MUSIC｜KICK BACK｜公開｜music-IJEE3lcAJl4"
          - "MUSIC｜クリスマスソング｜公開｜music-TNLk16KjMZ4"
          - "MUSIC｜ラヴィ｜公開｜music-98w0UpVFig4"
          - "MUSIC｜だいしきゅーだいしゅき｜公開｜music-gf8AhhnpDgk"
          - "MUSIC｜君のオシゴト手伝います！｜公開｜music-unF6seg9X3g"
          - "MUSIC｜神っぽいな｜公開｜music-2kKziuZKGiM"
          - "MUSIC｜Chrom 歌ってみた｜公開｜music-035EH-9aLB0"
          - "GOODS｜アルロッド3周年ちびキャラグッズ｜公開｜goods-alrod-3rd"
      title:
        description: "新しいタイトル（変更しない場合は空欄）"
        required: false
        type: string
      date:
        description: "新しい日付・日時（変更しない場合は空欄）"
        required: false
        type: string
      category:
        description: "NEWSカテゴリ（変更しない場合は空欄）"
        required: false
        type: string
      artist:
        description: "歌唱者 ALROD / CHROM / VI-LAIN（変更しない場合は空欄）"
        required: false
        type: string
      url:
        description: "新しいURL（変更しない場合は空欄）"
        required: false
        type: string
      image:
        description: "新しい画像パス（変更しない場合は空欄）"
        required: false
        type: string
      status:
        description: "GOODS販売状況（変更しない場合は空欄）"
        required: false
        type: string
      price:
        description: "価格（変更しない場合は空欄）"
        required: false
        type: string
      description:
        description: "説明（変更しない場合は空欄）"
        required: false
        type: string
      published:
        description: "公開状態"
        required: true
        default: "keep"
        type: choice
        options: [keep, "true", "false"]
      publish_at:
        description: "公開予約（変更しない場合は空欄）"
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CMS_PAT }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse selected item
        id: selected
        env:
          TARGET: ${{ inputs.target }}
        run: |
          ITEM_ID="${TARGET##*｜}"
          PREFIX="${TARGET%%｜*}"
          case "$PREFIX" in
            NEWS) COLLECTION="news" ;;
            MUSIC) COLLECTION="music" ;;
            GOODS) COLLECTION="goods" ;;
            EVENT) COLLECTION="events" ;;
            *) echo "対象を判別できません"; exit 1 ;;
          esac
          echo "id=$ITEM_ID" >> "$GITHUB_OUTPUT"
          echo "collection=$COLLECTION" >> "$GITHUB_OUTPUT"
      - name: Edit selected item
        env:
          COLLECTION: ${{ steps.selected.outputs.collection }}
          ITEM_ID: ${{ steps.selected.outputs.id }}
          TITLE: ${{ inputs.title }}
          DATE_VALUE: ${{ inputs.date }}
          CATEGORY: ${{ inputs.category }}
          ARTIST: ${{ inputs.artist }}
          URL_VALUE: ${{ inputs.url }}
          IMAGE: ${{ inputs.image }}
          STATUS_VALUE: ${{ inputs.status }}
          PRICE: ${{ inputs.price }}
          DESCRIPTION: ${{ inputs.description }}
          PUBLISHED: ${{ inputs.published }}
          PUBLISH_AT: ${{ inputs.publish_at }}
        run: |
          python scripts/cms.py edit \
            --collection "$COLLECTION" \
            --id "$ITEM_ID" \
            --title "$TITLE" \
            --date "$DATE_VALUE" \
            --category "$CATEGORY" \
            --artist "$ARTIST" \
            --url "$URL_VALUE" \
            --image "$IMAGE" \
            --status "$STATUS_VALUE" \
            --price "$PRICE" \
            --description "$DESCRIPTION" \
            --published "$PUBLISHED" \
            --publish-at "$PUBLISH_AT"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cms/content.json cms/INDEX.md data/content.js .github/workflows/cms-edit.yml .github/workflows/cms-delete.yml
          git commit -m "CMS: edit selected content"
          git push
