name: "CMS 01 - NEWSを追加"

on:
  workflow_dispatch:
    inputs:
      title:
        description: "タイトル"
        required: true
        type: string
      category:
        description: "カテゴリ"
        required: true
        default: "INFO"
        type: choice
        options: [INFO, MUSIC, GOODS, EVENT, LIVE]
      date:
        description: "表示日（YYYY-MM-DD・空欄で今日）"
        required: false
        type: string
      url:
        description: "リンク先（任意）"
        required: false
        type: string
      published:
        description: "すぐ公開する"
        required: true
        default: true
        type: boolean
      publish_at:
        description: "公開予約（例 2026-09-06T20:00:00+09:00）"
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CMS_PAT }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add NEWS
        env:
          TITLE: ${{ inputs.title }}
          CATEGORY: ${{ inputs.category }}
          DATE: ${{ inputs.date }}
          URL: ${{ inputs.url }}
          PUBLISHED: ${{ inputs.published }}
          PUBLISH_AT: ${{ inputs.publish_at }}
        run: |
          python scripts/cms.py add-news \
            --title "$TITLE" \
            --category "$CATEGORY" \
            --date "$DATE" \
            --url "$URL" \
            --published "$PUBLISHED" \
            --publish-at "$PUBLISH_AT"
      - name: Commit CMS changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cms/content.json cms/INDEX.md data/content.js .github/workflows/cms-edit.yml .github/workflows/cms-delete.yml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "CMS: ${{ github.workflow }}"
          git push
