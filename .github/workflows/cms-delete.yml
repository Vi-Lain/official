name: "CMS 06 - 内容を削除"

on:
  workflow_dispatch:
    inputs:
      collection:
        description: "削除する種類"
        required: true
        type: choice
        options:
          - news
          - music
          - goods
          - events
      current_title:
        description: "削除する現在のタイトル（完全一致）"
        required: true
        type: string
      confirmation:
        description: "削除する場合は DELETE と入力"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm deletion
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DELETE" ]; then
            echo "確認文字が違います。DELETE と入力してください。"
            exit 1
          fi

      - name: Delete content
        env:
          COLLECTION: ${{ inputs.collection }}
          CURRENT_TITLE: ${{ inputs.current_title }}
        run: |
          python scripts/cms.py delete \
            --collection "$COLLECTION" \
            --current-title "$CURRENT_TITLE"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cms/content.json cms/INDEX.md data/content.js

          if git diff --cached --quiet; then
            echo "削除による変更がありません。"
            exit 0
          fi

          git commit -m "CMS: delete content"
          git push
