name: "CMS 00 - 構成チェック"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate CMS
        run: |
          python -m py_compile scripts/cms.py
          python scripts/cms.py list
          test -f cms/content.json
          test -f cms/INDEX.md
          echo "CMS configuration is valid."
